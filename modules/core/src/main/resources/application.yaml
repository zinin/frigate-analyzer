server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /
spring:
  main:
    web-application-type: reactive
  application:
    name: FrigateAnalyzer
  webflux:
    base-path: /frigate-analyzer
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:frigate_analyzer}
    username: ${DB_USER:frigate_analyzer_rw}
    password: ${DB_PASS:frigate_analyzer_rw}
    pool:
      enabled: true
      initial-size: 10
      max-size: 100
  task:
    scheduling:
      pool:
        size: 10
    execution:
      pool:
        max-size: 10
application:
  records-watcher:
    # Disabled by default: the startup scan is an opt-in backfill (first install, index recovery).
    # A fixed scan that actually finishes would otherwise run a never-observed ~52k backfill on a
    # fresh deployment with default settings.
    disable-first-scan: ${DISABLE_FIRST_SCAN:true}
    folder: ${FRIGATE_RECORDS_FOLDER:/mnt/data/frigate/recordings}
    watch-period: ${WATCH_PERIOD:P1D}
    # Defaults to watch-period: the startup backfill covers exactly the window the watcher watches.
    # Empty default on purpose: an empty value binds to null, so the Kotlin default
    # `Duration.ofDays(watchPeriod.toDays())` in RecordsWatcherProperties takes over and sees the
    # already-resolved watch-period — from env, a profile yaml, a CLI argument or a relaxed name
    # alike. It is truncated because watchCutoff truncates too, so a PT36H watch-period yields P1D
    # here instead of failing the whole-days check on a variable nobody set. The line still has to
    # exist so the short FIRST_SCAN_PERIOD variable binds at all.
    # Not `${FIRST_SCAN_PERIOD:${application.records-watcher.watch-period}}`: relaxed name mapping is
    # guaranteed for @ConfigurationProperties binding but not for placeholder resolution, and
    # RecordsWatcherPropertiesBindingTest showed that reference resolving to the yaml's own P1D
    # instead of an APPLICATION_RECORDSWATCHER_WATCHPERIOD override. The reappear-gap line below uses
    # the reference form safely only because its target property contains no hyphen to strip.
    first-scan-period: ${FIRST_SCAN_PERIOD:}
    cleanup-interval: ${WATCH_CLEANUP_INTERVAL:PT1H}
  temp-folder: ${TEMP_FOLDER:/tmp/frigate-analyzer/}
  ffmpeg-path: ${FFMPEG_PATH:/usr/bin/ffmpeg}
  ffprobe-path: ${FFPROBE_PATH:/usr/bin/ffprobe}
  export:
    compress:
      preset: ${EXPORT_COMPRESS_PRESET:fast}
      crf: ${EXPORT_COMPRESS_CRF:23}
      min-bits-per-pixel: ${EXPORT_COMPRESS_MIN_BITS_PER_PIXEL:0.1}
  connection-timeout: ${CONNECTION_TIMEOUT:10s}
  read-timeout: ${READ_TIMEOUT:30s}
  write-timeout: ${WRITE_TIMEOUT:30s}
  response-timeout: ${RESPONSE_TIMEOUT:30s}
  telegram:
    enabled: ${TELEGRAM_ENABLED:true}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    owner: ${TELEGRAM_OWNER:}
    queue-capacity: ${TELEGRAM_QUEUE_CAPACITY:100}
    send-video-timeout: ${TELEGRAM_SEND_VIDEO_TIMEOUT:3m}
    proxy:
      host: ${TELEGRAM_PROXY_HOST:}
      port: ${TELEGRAM_PROXY_PORT:1080}
  signal-loss:
    enabled: ${SIGNAL_LOSS_ENABLED:true}
    threshold: ${SIGNAL_LOSS_THRESHOLD:3m}
    poll-interval: ${SIGNAL_LOSS_POLL_INTERVAL:30s}
    active-window: ${SIGNAL_LOSS_ACTIVE_WINDOW:24h}
    startup-grace: ${SIGNAL_LOSS_STARTUP_GRACE:5m}
  notifications:
    cooldown:
      # Minimum distance between two REAPPEARED notifications for one camera, measured on the
      # recording timestamp rather than the wall clock — a backlog drained newest-first would
      # otherwise collapse into a single notification. PT0S (the default) disables the gate.
      reappear: ${NOTIFICATIONS_COOLDOWN_REAPPEAR:PT0S}
    tracker:
      ttl: ${NOTIFICATIONS_TRACK_TTL:PT30M}
      iou-threshold: ${NOTIFICATIONS_TRACK_IOU_THRESHOLD:0.3}
      inner-iou: ${NOTIFICATIONS_TRACK_INNER_IOU:0.5}
      confidence-floor: ${NOTIFICATIONS_TRACK_CONFIDENCE_FLOOR:0.3}
      cleanup-interval-ms: ${NOTIFICATIONS_TRACK_CLEANUP_INTERVAL_MS:3600000}
      cleanup-retention: ${NOTIFICATIONS_TRACK_CLEANUP_RETENTION:PT1H}
      # Defaults to ttl, which makes reappearance detection a no-op (ttl also bounds findActive).
      # The default references the resolved property rather than $NOTIFICATIONS_TRACK_TTL, so it
      # follows ttl from whichever source sets it — env, the docker profile yaml, a CLI argument.
      # Same form as claude.working-directory below; reading the variable instead would silently
      # fall back to PT30M whenever ttl is set by anything other than that one env var.
      reappear-gap: ${NOTIFICATIONS_TRACK_REAPPEAR_GAP:${application.notifications.tracker.ttl}}
      # Classes allowed to notify when they come *back*. Empty (the default) means all of them,
      # which keeps this a no-op. Narrowing it never affects first-time appearances, and it is
      # unrelated to application.detection-filter.allowed-classes.
      reappear-classes: ${NOTIFICATIONS_TRACK_REAPPEAR_CLASSES:}
  ai:
    description:
      enabled: ${APP_AI_DESCRIPTION_ENABLED:false}
      # Legacy-путь: применяется, только когда карта presets пуста. Тогда из него и из секции
      # провайдера синтезируется единственный пресет.
      provider: ${APP_AI_DESCRIPTION_PROVIDER:claude}
      # Активный пресет по умолчанию; пусто = первый годный из presets. Сами presets объявляются
      # в смонтированном application-docker.yaml, пример — в application-docker.yaml.example.
      default-preset: ${APP_AI_DESCRIPTION_DEFAULT_PRESET:}
      common:
        language: ${APP_AI_DESCRIPTION_LANGUAGE:en}
        short-max-length: ${APP_AI_DESCRIPTION_SHORT_MAX:200}
        detailed-max-length: ${APP_AI_DESCRIPTION_DETAILED_MAX:1500}
        max-frames: ${APP_AI_DESCRIPTION_MAX_FRAMES:10}
        # Длинная сторона кадра в пикселях перед отправкой модели; 0 = отдавать как есть.
        # Кадры идут в разрешении камеры: токены считаются по площади, а некоторые
        # vision-шлюзы молча выбрасывают картинку больше своего предела (1568 px у LiteLLM).
        max-image-side: ${APP_AI_DESCRIPTION_MAX_IMAGE_SIDE:0}
        queue-timeout: ${APP_AI_DESCRIPTION_QUEUE_TIMEOUT:30s}
        timeout: ${APP_AI_DESCRIPTION_TIMEOUT:60s}
        max-concurrent: ${APP_AI_DESCRIPTION_MAX_CONCURRENT:2}
        rate-limit:
          enabled: ${APP_AI_DESCRIPTION_RATE_LIMIT_ENABLED:true}
          max-requests: ${APP_AI_DESCRIPTION_RATE_LIMIT_MAX:30}
          window: ${APP_AI_DESCRIPTION_RATE_LIMIT_WINDOW:1h}
      claude:
        oauth-token: ${CLAUDE_CODE_OAUTH_TOKEN:}
        model: ${CLAUDE_MODEL:opus}
        cli-path: ${CLAUDE_CLI_PATH:}
        working-directory: ${CLAUDE_WORKING_DIR:${application.temp-folder}}
        # Потолок одного JSON-сообщения от CLI (Spring DataSize). В stream-json CLI эхом возвращает
        # tool_result с base64-картинкой каждого прочитанного кадра; дефолт SDK в 1 MiB не вмещает
        # кадр уже от ~750 KB.
        max-buffer-size: ${CLAUDE_MAX_BUFFER_SIZE:16MB}
        anthropic:
          auth-token: ${ANTHROPIC_AUTH_TOKEN:}
          base-url: ${ANTHROPIC_BASE_URL:}
          model-override: ${ANTHROPIC_MODEL:}
          default-opus-model: ${ANTHROPIC_DEFAULT_OPUS_MODEL:}
          default-sonnet-model: ${ANTHROPIC_DEFAULT_SONNET_MODEL:}
          default-haiku-model: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:}
        proxy:
          http: ${CLAUDE_HTTP_PROXY:}
          https: ${CLAUDE_HTTPS_PROXY:}
          no-proxy: ${CLAUDE_NO_PROXY:}
      grok:
        cli-path: ${GROK_CLI_PATH:}
        model: ${GROK_MODEL:grok-4.6}
        # Пусто = флаг --effort не передаётся (BYOK-модели без уровней reasoning).
        effort: ${GROK_EFFORT:low}
        # Собственный каталог Grok: auth.json, config.toml, сессии. В контейнере это том.
        # Та же переменная ведёт ручной `grok login` внутри `docker compose exec`.
        home: ${GROK_HOME:${application.temp-folder}/grok-home}
        # Пустой каталог для --cwd: Grok читает из cwd AGENTS.md, CLAUDE.md, .claude/rules и .grok.
        working-directory: ${GROK_WORKING_DIR:${application.temp-folder}/grok-cwd}
        proxy:
          http: ${GROK_HTTP_PROXY:}
          https: ${GROK_HTTPS_PROXY:}
          no-proxy: ${GROK_NO_PROXY:}
        # Имена переменных окружения, которые нужно передать дочернему grok дословно, через запятую.
        # Нужно для BYOK-модели, чей [model.<name>] в config.toml ссылается на env_key с именем
        # вне префиксов GROK_ и XAI_ — иначе ключ до grok не доедет.
        pass-through-env: ${GROK_PASS_THROUGH_ENV:}
    # LLM-судья уведомлений: третья ступень между трекером и отправкой в Telegram. Работает на
    # общем каталоге пресетов описаний (application.ai.description.presets), но со своим пресетом,
    # лимитами и выключателем в /ai. Требует application.ai.description.enabled=true.
    judge:
      enabled: ${APP_AI_JUDGE_ENABLED:false}
      # Пресет судьи до первого выбора владельца в /ai; пусто = default-preset описаний.
      default-preset: ${APP_AI_JUDGE_DEFAULT_PRESET:}
      queue-timeout: ${APP_AI_JUDGE_QUEUE_TIMEOUT:30s}
      timeout: ${APP_AI_JUDGE_TIMEOUT:60s}
      max-concurrent: ${APP_AI_JUDGE_MAX_CONCURRENT:2}
      # Кадры с рамками, первые N по ранжированию визуализации, в хронологическом порядке.
      max-frames: ${APP_AI_JUDGE_MAX_FRAMES:4}
      max-image-side: ${APP_AI_JUDGE_MAX_IMAGE_SIDE:1280}
      rate-limit:
        enabled: ${APP_AI_JUDGE_RATE_LIMIT_ENABLED:true}
        max-requests: ${APP_AI_JUDGE_RATE_LIMIT_MAX:200}
        window: ${APP_AI_JUDGE_RATE_LIMIT_WINDOW:1h}
      # Потолок snooze_minutes из ответа модели.
      max-snooze: ${APP_AI_JUDGE_MAX_SNOOZE:PT30M}
      # Static score: сколько записей за окно содержали тот же класс в том же месте (IoU >= порога).
      static-window: ${APP_AI_JUDGE_STATIC_WINDOW:P7D}
      static-iou: ${APP_AI_JUDGE_STATIC_IOU:0.4}
      # История вердиктов камеры в контексте: ± окно вокруг записи и число строк.
      history-window: ${APP_AI_JUDGE_HISTORY_WINDOW:PT6H}
      history-limit: ${APP_AI_JUDGE_HISTORY_LIMIT:10}
      # Зона локальных времён в промпте; пусто = зона владельца из /timezone, затем зона JVM.
      zone: ${APP_AI_JUDGE_ZONE:}
      # Заметки владельца о сценах камер, только yaml (application-docker.yaml):
      # cameras:
      #   cam4: { notes: "Огород за домом: грядки под сеткой, куча земли, поленница слева внизу." }
      cameras: {}
  detection-filter:
    enabled: ${DETECTION_FILTER_ENABLED:true}
    allowed-classes: ${DETECTION_FILTER_CLASSES:person,car,motorcycle,truck,bicycle,cat,dog,bird,backpack,horse,sheep,cow,bear,elephant,zebra,giraffe}
  detect:
    retry-delay: ${DETECT_RETRY_DELAY:500ms}
    frame-timeout: ${DETECT_FRAME_TIMEOUT:60s}
    frame-extraction-timeout: ${DETECT_FRAME_EXTRACTION_TIMEOUT:5m}
    visualize-timeout: ${DETECT_VISUALIZE_TIMEOUT:60s}
    health-check-timeout: ${DETECT_HEALTH_CHECK_TIMEOUT:5s}
    health-check-interval: ${DETECT_HEALTH_CHECK_INTERVAL:30s}
    default-confidence: ${DETECT_DEFAULT_CONFIDENCE:0.6}
    default-img-size: ${DETECT_DEFAULT_IMG_SIZE:2016}
    default-model: ${DETECT_DEFAULT_MODEL:yolo26s.pt}
    good-model: ${DETECT_GOOD_MODEL:yolo26x.pt}
    frame-extraction:
      scene-threshold: ${DETECT_SCENE_THRESHOLD:0.05}
      min-interval: ${DETECT_MIN_INTERVAL:1.0}
      max-frames: ${DETECT_MAX_FRAMES:50}
      quality: ${DETECT_FRAME_QUALITY:85}
    visualize:
      max-det: ${DETECT_MAX_DET:100}
      line-width: ${DETECT_LINE_WIDTH:2}
      show-labels: ${DETECT_SHOW_LABELS:true}
      show-conf: ${DETECT_SHOW_CONF:true}
      quality: ${DETECT_VISUALIZE_QUALITY:90}
    video-visualize:
      # Must stay below the 75m annotated outer timeouts (Telegram QuickExport and /export)
      # with room to spare for the merge and the two size-fitting passes, or the dedicated
      # annotation-timeout message is replaced by a generic one.
      timeout: ${DETECT_VIDEO_VISUALIZE_TIMEOUT:45m}
      poll-interval: ${DETECT_VIDEO_VISUALIZE_POLL_INTERVAL:3s}
      max-det: ${DETECT_VIDEO_VISUALIZE_MAX_DET:100}
      detect-every: ${DETECT_VIDEO_VISUALIZE_DETECT_EVERY:1}
      line-width: ${DETECT_VIDEO_VISUALIZE_LINE_WIDTH:2}
      show-labels: ${DETECT_VIDEO_VISUALIZE_SHOW_LABELS:true}
      show-conf: ${DETECT_VIDEO_VISUALIZE_SHOW_CONF:true}
  pipeline:
    frame:
      channel-buffer-size: ${PIPELINE_FRAME_BUFFER_SIZE:500}
      min-consumers: ${PIPELINE_FRAME_MIN_CONSUMERS:1}
      producers-count: ${PIPELINE_FRAME_PRODUCERS_COUNT:6}
    producer:
      idle-delay: ${PIPELINE_IDLE_DELAY:1s}
      error-delay: ${PIPELINE_ERROR_DELAY:5s}
      batch-size: ${PIPELINE_BATCH_SIZE:10}
  local-visualization:
    line-width: ${LOCAL_VIZ_LINE_WIDTH:2}
    quality: ${LOCAL_VIZ_QUALITY:90}
    reference-height: ${LOCAL_VIZ_REFERENCE_HEIGHT:720}
    min-font-scale: ${LOCAL_VIZ_MIN_FONT_SCALE:0.5}
    max-font-scale: ${LOCAL_VIZ_MAX_FONT_SCALE:2.2}
    base-font-scale: ${LOCAL_VIZ_BASE_FONT_SCALE:2.0}
    base-font-size: ${LOCAL_VIZ_BASE_FONT_SIZE:16}
    label-padding: ${LOCAL_VIZ_LABEL_PADDING:4}
    max-frames: ${LOCAL_VIZ_MAX_FRAMES:10}

management:
  endpoint:
    health:
      # Default `always`: this is a single-deployment project, and computeHealth already builds a
      # `reason` plus registeredDirs / lastSuccessfulRegistrationAt that Spring otherwise discards.
      # A bare {"status":"DOWN"} is what forced the 9-minute registration stall to be diagnosed
      # from logs instead of from the endpoint.
      show-details: ${HEALTH_SHOW_DETAILS:always}
